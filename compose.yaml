services:
  app:
    image: 'mgcss-track:latest'
    ports:
      - '8080:8080'
    environment:
      # Activamos el perfil de producción (opcional, dependiendo de tu application.yml)
      - SPRING_PROFILES_ACTIVE=prod
      # La URL apunta a "postgres" (el nombre del servicio de abajo) en vez de localhost
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/mydatabase
      - SPRING_DATASOURCE_USERNAME=myuser
      - SPRING_DATASOURCE_PASSWORD=secret
    depends_on:
      - postgres

  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: